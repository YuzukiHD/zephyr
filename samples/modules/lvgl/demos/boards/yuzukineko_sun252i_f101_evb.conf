# 1024x600 RGB565 panel, framebuffer in the on-chip PSRAM
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_LV_Z_MEM_POOL_SIZE=262144
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_MAIN_STACK_SIZE=8192
# debug output and the display shell commands
CONFIG_DISPLAY_LOG_LEVEL_DBG=y
CONFIG_HAL_TEST_DISPLAY_ENGINE=y
CONFIG_LV_DEMO_MUSIC_AUTO_PLAY=y
