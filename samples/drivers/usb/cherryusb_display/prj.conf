CONFIG_CHERRYUSB=y
CONFIG_CHERRYUSB_DEVICE=y
CONFIG_CHERRYUSB_DEVICE_SPEED_HS=y
CONFIG_CHERRYUSB_DEVICE_MUSB_SUNXI=y
CONFIG_CHERRYUSB_DEVICE_DISPLAY=y
CONFIG_CHERRYUSB_DEVICE_HID=y

CONFIG_DISPLAY=y
CONFIG_VDEC=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=-1
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_PRINTK=y
CONFIG_SHELL=n
CONFIG_DEVMEM_SHELL=n

# drivers the second screen does not use
CONFIG_G2D=n
CONFIG_ADC=n
CONFIG_SPI=n
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_MIPI_DBI=n
CONFIG_WDT_SUNXI=n

# a small image: no logging (errors of the drivers are not printed), size optimised code
CONFIG_LOG=n
CONFIG_SIZE_OPTIMIZATIONS=y

# the frame buffer comes from the heap, not from the image
CONFIG_DISPLAY_SUNXI_FB_ALLOC=y
