# The frame buffer of the sample is ARGB8888, the display stack and the shell need memory.
CONFIG_DISPLAY_SUNXI_ARGB8888=y
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_MAIN_STACK_SIZE=8192

# One touch point, a short redraw period and an input thread that is not starved by the drawing
# thread (it runs at the lowest priority by default, a swipe then fills the event queue).
CONFIG_INPUT_GT967_MAX_TOUCH_POINTS=1
CONFIG_SAMPLE_REFRESH_PERIOD_MS=10
CONFIG_INPUT_THREAD_PRIORITY_OVERRIDE=y
CONFIG_INPUT_THREAD_PRIORITY=-1
CONFIG_INPUT_QUEUE_MAX_MSGS=64
