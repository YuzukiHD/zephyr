description: Allwinner sunxi SPI controller

compatible: "allwinner,sunxi-spi"

include: [spi-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true

  clock-names:
    required: true

  resets:
    type: phandle-array
    required: true

  clock-frequency:
    type: int
    required: true

  clock-reg:
    type: int
    required: true
