description: MIPI DSI panel driven by the display pipeline.

compatible: "panel-dsi"

include: panel-common.yaml

properties:
  data-lanes:
    type: array
    required: true
    description: DSI data lanes, one cell per lane.

  mipi-dsi-format:
    type: string
    required: true
    enum:
      - "rgb888"
      - "rgb666"
      - "rgb666-packed"
      - "rgb565"

  mode-flags:
    type: int
    default: 0
    description: SUNXI_DSI_MODE_* flags.

  hs-trail:
    type: int
    default: 0

  clk-trail:
    type: int
    default: 0
