description: Allwinner F101 display engine 2.x (mixer, planes, blender).

compatible: "allwinner,sun252iw2-display-engine"

include: sunxi-display-ports.yaml

properties:
  reg:
    required: true

  brightness:
    type: int
    default: 50
    description: Colour adjustment, 0..100 (50 is neutral).

  contrast:
    type: int
    default: 50

  saturation:
    type: int
    default: 50

  hue:
    type: int
    default: 50

  background-color:
    type: int
    default: 0
    description: Colour shown where no plane covers the screen, 0xRRGGBB.
